services:
  - type: web
    name: voice-patient-intake
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VAPI_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
